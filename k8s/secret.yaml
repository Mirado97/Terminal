# Заполнить base64-значениями перед применением:
#   echo -n "value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: arbitrage-secrets
  namespace: arbitrage
type: Opaque
data:
  POSTGRES_URL: <base64-encoded-postgres-url>
  REDIS_URL: <base64-encoded-redis-url>
  BYBIT_API_KEY: <base64-encoded>
  BYBIT_API_SECRET: <base64-encoded>
  BINANCE_API_KEY: <base64-encoded>
  BINANCE_API_SECRET: <base64-encoded>
