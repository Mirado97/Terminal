[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "arbitrage-terminal"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "msgspec>=0.18",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.10",
    "orjson>=3.10",
    "numpy>=2.0",
    "asyncpg>=0.29",
    "redis[hiredis]>=5.0",
    "prometheus-client>=0.20",
    "python-socks[asyncio]>=2.4",
    "aiohttp-socks>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "config*"]
