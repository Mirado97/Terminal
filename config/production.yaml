app:
  name: arbitrage-terminal
  env: production
  log_level: WARNING

exchanges:
  bybit:
    testnet: false
    rest_url: "https://api.bybit.com"
    ws_url: "wss://stream.bybit.com/v5/public"
    rate_limit:
      requests_per_second: 20
      orders_per_second: 10
  binance:
    testnet: false
    rest_url: "https://api.binance.com"
    ws_url: "wss://stream.binance.com:9443/ws"
    rate_limit:
      requests_per_second: 20
      orders_per_second: 10

trading:
  min_spread_bps: 10
  max_position_usdt: 2000
  max_exposure_usdt: 10000
  target_pairs:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "BNBUSDT"
    - "XRPUSDT"

risk:
  max_drawdown_pct: 3.0
  emergency_stop_loss_pct: 7.0
  max_open_orders: 100

storage:
  postgres_url: "${POSTGRES_URL}"
  redis_url: "${REDIS_URL}"

monitoring:
  prometheus_port: 9090
  metrics_interval_sec: 1
  api_host: "0.0.0.0"
  api_port: 8080
